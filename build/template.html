<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工安 × 工作倫理｜速成闖關</title>
<meta name="description" content="松山工農 機一仁｜勞動部官方固定題庫 200 題，電玩闖關風格的工場安全衛生與工作倫理複習測驗。">
<!-- PWA：可加到手機主畫面、離線可刷題 -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="工安速成">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@700;900&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* ===== 電玩闖關風：深色底＋霓虹青／螢光粉。字型抓不到（離線）時自動退回系統字型 ===== */
:root{
  --bg:#0a0a1a; --bg2:#10102a; --card:#15153a; --card2:#1c1c48;
  --line:rgba(0,240,255,.18); --line2:rgba(255,46,151,.28);
  --txt:#eef2ff; --sub:#b4bce0; --mut:#7c83ad;
  --cyan:#00f0ff; --pink:#ff2e97; --lime:#b6ff3b; --amber:#ffd23f; --red:#ff4d6d; --violet:#9d6bff;
  --acc:var(--cyan); --good:var(--lime); --bad:var(--red); --warn:var(--amber);
  --chip:#1a1a44;
  --glow-c:0 0 0 1px rgba(0,240,255,.35),0 0 18px rgba(0,240,255,.25);
  --glow-p:0 0 0 1px rgba(255,46,151,.45),0 0 18px rgba(255,46,151,.3);
  --r:16px; --nav-h:58px;
  --f-pix:"Press Start 2P",ui-monospace,monospace;
  --f-num:"Orbitron","Segoe UI",sans-serif;
  --f-zh:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
:root[data-theme="light"]{
  --bg:#f3f1ff; --bg2:#ffffff; --card:#ffffff; --card2:#f6f4ff;
  --line:rgba(80,60,200,.18); --line2:rgba(220,20,120,.25);
  --txt:#16143a; --sub:#4a4775; --mut:#7d7aa3;
  --cyan:#0090b0; --pink:#d4127a; --lime:#2f9e1f; --amber:#b07a00; --red:#d81b45; --violet:#6a3dd8;
  --chip:#ece9ff;
  --glow-c:0 0 0 1px rgba(0,144,176,.35),0 6px 16px rgba(60,40,160,.10);
  --glow-p:0 0 0 1px rgba(212,18,122,.4),0 6px 16px rgba(60,40,160,.10);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  color:var(--txt); font-family:var(--f-zh); line-height:1.75; -webkit-font-smoothing:antialiased;
  background-color:var(--bg);
  background-image:
    radial-gradient(900px 500px at 85% -10%,rgba(255,46,151,.16),transparent 60%),
    radial-gradient(800px 500px at -10% 10%,rgba(0,240,255,.14),transparent 60%),
    linear-gradient(rgba(0,240,255,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,240,255,.05) 1px,transparent 1px);
  background-size:auto,auto,32px 32px,32px 32px;
  background-attachment:fixed;
  min-height:100vh;
}
:root[data-theme="light"] body{background-image:
    radial-gradient(900px 500px at 85% -10%,rgba(212,18,122,.08),transparent 60%),
    radial-gradient(800px 500px at -10% 10%,rgba(0,144,176,.08),transparent 60%),
    linear-gradient(rgba(80,60,200,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(80,60,200,.05) 1px,transparent 1px);}
a{color:var(--cyan)}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
.pix{font-family:var(--f-pix);letter-spacing:.5px}
.num{font-family:var(--f-num)}

/* ---------- 標題區 ---------- */
header.top{padding:22px 0 16px}
.hdr{display:flex;align-items:flex-start;gap:14px}
.brand-block{flex:1;min-width:0}
.brand{font-size:32px;font-weight:900;line-height:1.25;letter-spacing:1px;
  background:linear-gradient(90deg,var(--cyan),#8ab4ff 45%,var(--pink));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 12px rgba(0,240,255,.35))}
.brand small{font-size:.55em;margin-left:6px;vertical-align:middle;-webkit-text-fill-color:var(--txt);
  color:var(--txt);background:var(--pink);padding:2px 10px;border-radius:8px;letter-spacing:2px;
  box-shadow:0 0 14px rgba(255,46,151,.55);display:inline-block;transform:rotate(-4deg)}
.byline{margin-top:8px;font-size:14px;font-weight:700;color:var(--sub);letter-spacing:1.5px;word-break:keep-all}
.byline .ai{color:var(--lime);font-family:var(--f-num)}
.themebtn{flex-shrink:0;background:var(--card);border:1px solid var(--line);color:var(--txt);
  width:42px;height:42px;border-radius:12px;cursor:pointer;font-size:18px;box-shadow:var(--glow-c)}

/* ---------- 分頁列（黏頂） ---------- */
nav.tabbar{position:sticky;top:0;z-index:50;background:rgba(10,10,26,.86);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
:root[data-theme="light"] nav.tabbar{background:rgba(255,255,255,.9)}
.tabs{display:flex;gap:6px;padding:8px 0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex-shrink:0;background:transparent;border:1px solid transparent;color:var(--sub);
  font-family:var(--f-zh);font-size:15px;font-weight:700;padding:8px 16px;border-radius:12px;cursor:pointer;white-space:nowrap}
.tabs button:hover{color:var(--txt);border-color:var(--line)}
.tabs button.on{color:#0a0a1a;background:var(--cyan);box-shadow:0 0 16px rgba(0,240,255,.55)}
:root[data-theme="light"] .tabs button.on{color:#fff}

section.page{display:none;padding:26px 0 80px}
section.page.on{display:block;animation:rise .3s ease}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

h1.ph{font-size:30px;margin:4px 0 6px;font-weight:900;line-height:1.3}
h1.ph::before{content:"▶ ";color:var(--pink);font-size:.7em;vertical-align:middle}
.lead{color:var(--sub);margin:0 0 22px;font-size:16px}
h2.sec{font-size:21px;margin:38px 0 14px;font-weight:900;display:flex;align-items:center;gap:10px}
h2.sec::before{content:"";width:12px;height:12px;background:var(--pink);transform:rotate(45deg);
  box-shadow:0 0 10px var(--pink);flex-shrink:0}
h3.sub{font-size:17px;margin:20px 0 8px;font-weight:900;color:var(--cyan)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:20px 22px;margin:14px 0;box-shadow:var(--glow-c)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:720px){.grid2{grid-template-columns:1fr}}

table{width:100%;border-collapse:collapse;font-size:15px;margin:6px 0}
table th,table td{text-align:left;padding:10px;border-bottom:1px dashed var(--line);vertical-align:top}
table th{color:var(--pink);font-weight:900;font-size:13px;letter-spacing:.5px}
table td.num{color:var(--amber);font-weight:900;white-space:nowrap;font-family:var(--f-num)}
table tr:last-child td{border-bottom:none}
.card{overflow-x:auto}

.pill{display:inline-block;background:var(--chip);color:var(--sub);border:1px solid var(--line);
  border-radius:8px;padding:2px 10px;font-size:12.5px;font-weight:700;margin:2px 4px 2px 0}
.pill.acc{color:var(--cyan);border-color:var(--cyan)}
.pill.warn{color:var(--amber);border-color:var(--amber)}
.pill.bad{color:var(--red);border-color:var(--red)}

/* 考點分布：血量條風格 */
.bar{margin:10px 0}
.bar .lab{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.bar .lab b{color:var(--txt);font-weight:700}
.bar .lab span{color:var(--mut);font-family:var(--f-num);font-size:12px}
.bar .track{height:12px;background:var(--chip);border-radius:3px;overflow:hidden;border:1px solid var(--line)}
.bar .fill{height:100%;background:repeating-linear-gradient(90deg,var(--cyan) 0 10px,#6fdcff 10px 12px);
  box-shadow:0 0 10px rgba(0,240,255,.6)}
.grid2 .card:nth-child(2) .bar .fill{background:repeating-linear-gradient(90deg,var(--pink) 0 10px,#ff7fbf 10px 12px);
  box-shadow:0 0 10px rgba(255,46,151,.6)}

.trap{border-left:4px solid var(--amber);background:var(--card2);padding:11px 15px;border-radius:0 12px 12px 0;margin:10px 0;font-size:15px}
.trap b{color:var(--amber)}
.good-note{border-left:4px solid var(--lime);background:var(--card2);padding:11px 15px;border-radius:0 12px 12px 0;margin:10px 0;font-size:15px}
.good-note b{color:var(--lime)}
ul.tight{margin:8px 0;padding-left:22px}
ul.tight li{margin:5px 0}

/* ---------- 按鈕 ---------- */
.btn{background:var(--cyan);color:#0a0a1a;border:none;border-radius:12px;padding:12px 20px;
  font-family:var(--f-zh);font-size:16px;font-weight:900;cursor:pointer;text-align:center;
  box-shadow:0 4px 0 #0090a0,0 0 18px rgba(0,240,255,.35);transition:transform .08s,box-shadow .08s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0090a0,0 0 10px rgba(0,240,255,.3)}
.btn.pink{background:var(--pink);color:#fff;box-shadow:0 4px 0 #a01060,0 0 18px rgba(255,46,151,.4)}
.btn.pink:active{box-shadow:0 1px 0 #a01060}
.btn.ghost{background:transparent;border:2px solid var(--cyan);color:var(--cyan);box-shadow:none}
.btn.gray{background:var(--chip);color:var(--txt);border:1px solid var(--line);box-shadow:0 4px 0 rgba(0,0,0,.35)}
.btn.gray:active{box-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn.sm{padding:8px 14px;font-size:14px}
.btn:disabled{opacity:.55;cursor:default}
:root[data-theme="light"] .btn{color:#fff}
:root[data-theme="light"] .btn.gray{color:var(--txt)}
:root[data-theme="light"] .btn.ghost{color:var(--cyan)}

/* ---------- 關卡選擇（測驗首頁） ---------- */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:720px){.modes{grid-template-columns:1fr}}
.mode{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:22px;display:flex;flex-direction:column;box-shadow:var(--glow-c);transition:transform .15s,box-shadow .15s;overflow:hidden}
.mode:hover{transform:translateY(-3px);box-shadow:var(--glow-p)}
.mode .lvtag{position:absolute;top:14px;right:14px;font-family:var(--f-pix);font-size:10px;color:var(--pink)}
.mode h3{margin:0 0 6px;font-size:21px;font-weight:900}
.mode .ico{font-size:30px;line-height:1;margin-bottom:8px}
.mode p{color:var(--sub);font-size:14.5px;margin:0 0 14px;flex:1}
.mstat{display:flex;gap:20px;margin-bottom:16px}
.mstat div{text-align:center}
.mstat b{display:block;font-size:26px;font-weight:900;color:var(--cyan);font-family:var(--f-num)}
.mstat span{font-size:12px;color:var(--mut)}

/* ---------- 題庫篩選 ---------- */
.filters{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.searchbox{display:flex;gap:8px}
.searchbox input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);color:var(--txt);
  border-radius:12px;padding:12px 15px;font-size:16px;font-family:var(--f-zh)}
.searchbox input:focus{outline:none;border-color:var(--cyan);box-shadow:var(--glow-c)}
.chiprow{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.chiprow .glab{font-size:13px;color:var(--pink);margin-right:2px;font-weight:900}
.fchip{background:var(--chip);border:1px solid var(--line);color:var(--sub);font-family:var(--f-zh);
  border-radius:10px;padding:6px 13px;font-size:13.5px;cursor:pointer;font-weight:700}
.fchip:hover{color:var(--txt)}
.fchip.on{background:var(--pink);color:#fff;border-color:var(--pink);box-shadow:0 0 12px rgba(255,46,151,.5)}
.toggles{display:flex;flex-wrap:wrap;gap:16px;font-size:14.5px;color:var(--sub)}
.toggles label{display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none;font-weight:700}
.toggles input{accent-color:var(--pink);width:17px;height:17px}
.count{font-size:13px;color:var(--mut);margin:4px 0 12px}

/* ---------- 題目卡 ---------- */
.q{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin:12px 0;box-shadow:var(--glow-c)}
.q .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.q .qid{font-size:12.5px;color:var(--mut);font-weight:900;margin-right:auto}
.q .star{background:none;border:none;cursor:pointer;font-size:20px;color:var(--mut);padding:0 2px}
.q .star.on{color:var(--amber);text-shadow:0 0 10px var(--amber)}
.q .stem{font-size:17px;font-weight:700;margin-bottom:12px;line-height:1.7}
.q .opts{display:flex;flex-direction:column;gap:9px}
.q .opt{display:flex;gap:11px;padding:11px 14px;border:1px solid var(--line);border-radius:12px;
  font-size:15.5px;cursor:pointer;background:var(--card2);transition:.12s}
.q .opt .k{font-weight:900;color:var(--mut);flex-shrink:0}
.q .opt:hover{border-color:var(--cyan);box-shadow:0 0 12px rgba(0,240,255,.25)}
.q .opt.correct{border-color:var(--lime);background:rgba(182,255,59,.12);box-shadow:0 0 14px rgba(182,255,59,.25)}
.q .opt.correct .k{color:var(--lime)}
.q .opt.wrong{border-color:var(--red);background:rgba(255,77,109,.13);animation:shake .3s}
.q .opt.wrong .k{color:var(--red)}
.q .opt.reveal-c{border-color:var(--lime)}
.q .opt.reveal-c .k{color:var(--lime)}
.q .opt.picked{border-color:var(--pink);background:rgba(255,46,151,.14);box-shadow:0 0 14px rgba(255,46,151,.3)}
.q .opt.picked .k{color:var(--pink)}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.q .ans{margin-top:11px;font-size:14.5px;color:var(--sub);display:none}
.q .ans.show{display:block}
.q .ans b{color:var(--lime)}

/* 題目解析 */
.exbtn{margin-top:12px;background:transparent;border:1px dashed var(--cyan);color:var(--cyan);font-family:var(--f-zh);
  border-radius:10px;padding:8px 15px;font-size:14px;font-weight:900;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.exbtn:hover{background:rgba(0,240,255,.08)}
.exbtn .cv{font-size:11px}
.expanel{display:none;margin-top:12px;padding:15px 17px;background:var(--card2);
  border:1px solid var(--line);border-left:4px solid var(--cyan);border-radius:0 12px 12px 0}
.expanel.open{display:block;animation:rise .2s ease}
.exlaw{font-size:13px;font-weight:900;color:var(--pink);margin-bottom:8px}
.exkey{font-size:16px;font-weight:900;color:var(--txt);margin-bottom:10px;line-height:1.6}
.extext{font-size:15px;color:var(--sub);line-height:1.9}

/* ---------- 測驗 HUD ---------- */
.exam-hd{position:sticky;top:var(--nav-h);z-index:20;background:rgba(16,16,42,.94);backdrop-filter:blur(8px);
  border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:16px;box-shadow:var(--glow-c)}
:root[data-theme="light"] .exam-hd{background:rgba(255,255,255,.95)}
.exam-hd .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.stage{font-family:var(--f-pix);font-size:12px;color:var(--pink)}
.timer{font-family:var(--f-num);font-weight:900;font-size:20px;color:var(--cyan);font-variant-numeric:tabular-nums}
.timer.warn{color:var(--red);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.exam-hd .prog{flex:1;min-width:120px}
.exam-hd .prog .track{height:12px;background:var(--chip);border-radius:3px;overflow:hidden;border:1px solid var(--line)}
.exam-hd .prog .fill{height:100%;width:0;transition:.25s;background:linear-gradient(90deg,var(--cyan),var(--pink));
  box-shadow:0 0 10px rgba(255,46,151,.5)}
.exam-meta{font-size:13px;color:var(--mut);font-family:var(--f-num)}
.hud-btns{display:flex;gap:8px;margin-left:auto}
.nav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px;margin:14px 0}
.nav-grid button{aspect-ratio:1;border:1px solid var(--line);background:var(--card);color:var(--sub);
  border-radius:8px;font-size:13px;font-weight:900;cursor:pointer;font-family:var(--f-num)}
.nav-grid button.done{background:var(--cyan);color:#0a0a1a;border-color:var(--cyan)}
.nav-grid button.cur{outline:3px solid var(--pink);outline-offset:1px}
.nav-grid button.mk{border:2px solid var(--amber);color:var(--amber)}
.nav-grid button.done.mk{color:#0a0a1a}
.exam-foot{display:flex;justify-content:space-between;gap:10px;margin-top:18px}

/* ---------- 結算畫面 ---------- */
.score-big{text-align:center;padding:26px 0 8px}
.rank{font-family:var(--f-pix);font-size:64px;line-height:1.1}
.rank.S{color:var(--amber);text-shadow:0 0 22px var(--amber)}
.rank.A{color:var(--lime);text-shadow:0 0 22px var(--lime)}
.rank.B{color:var(--cyan);text-shadow:0 0 22px var(--cyan)}
.rank.C{color:var(--violet);text-shadow:0 0 22px var(--violet)}
.rank.F{color:var(--red);text-shadow:0 0 22px var(--red)}
.score-big .n{font-family:var(--f-num);font-size:48px;font-weight:900;margin-top:10px}
.score-big .n.pass{color:var(--lime)}
.score-big .n.fail{color:var(--red)}
.score-big .verdict{font-size:24px;font-weight:900;margin-top:4px}
.score-big .sub{color:var(--sub);font-size:14.5px;margin-top:6px}
.lvup{display:inline-block;margin-top:12px;font-family:var(--f-pix);font-size:13px;color:#0a0a1a;background:var(--amber);
  padding:8px 14px;border-radius:8px;box-shadow:0 0 18px rgba(255,210,63,.6);animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.rescards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}
@media(max-width:620px){.rescards{grid-template-columns:1fr 1fr}}
.rescard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center;box-shadow:var(--glow-c)}
.rescard b{display:block;font-size:28px;font-weight:900;font-family:var(--f-num)}
.rescard span{font-size:12.5px;color:var(--mut)}

/* ---------- 成績／等級 ---------- */
.lvcard{display:flex;align-items:center;gap:18px}
.lvbadge{flex-shrink:0;width:84px;height:84px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--cyan),var(--pink));color:#0a0a1a;box-shadow:0 0 22px rgba(255,46,151,.45)}
.lvbadge small{font-family:var(--f-pix);font-size:9px}
.lvbadge b{font-family:var(--f-num);font-size:32px;line-height:1}
.xpbar{height:14px;background:var(--chip);border-radius:3px;overflow:hidden;border:1px solid var(--line);margin-top:6px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--lime),var(--amber));box-shadow:0 0 10px rgba(182,255,59,.5)}
.hist-row{display:flex;align-items:center;gap:14px;padding:12px 14px;background:var(--card);
  border:1px solid var(--line);border-radius:14px;margin:9px 0}
.hist-row .hr{font-family:var(--f-pix);font-size:20px;width:44px;text-align:center}
.hist-row .hs{font-size:22px;font-weight:900;width:60px;text-align:center;font-family:var(--f-num)}
.hist-row .hs.pass{color:var(--lime)}.hist-row .hs.fail{color:var(--red)}
.hist-row .hinfo{flex:1;font-size:14px;min-width:0}
.hist-row .hinfo .ht{color:var(--txt);font-weight:700}
.hist-row .hinfo .hd{color:var(--mut);font-size:12.5px}
.empty{text-align:center;color:var(--mut);padding:40px 0;font-size:15px}

/* ---------- PK 對戰 ---------- */
.vs-bar{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;
  background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;
  margin-bottom:16px;box-shadow:var(--glow-p);position:sticky;top:var(--nav-h);z-index:20}

/* ---------- 得分從選項飛向計分板 ---------- */
/* transition 必須寫在基礎 class 上：若只寫在 .pop，瀏覽器會把「加上 transition」
   與「改變 opacity」併成同一次樣式計算，動畫不會觸發（元素會一直是透明的）。 */
.fly-score{position:fixed;z-index:130;pointer-events:none;transform:translate(-50%,-50%) scale(.6);
  font-family:var(--f-num);font-weight:900;font-size:68px;color:var(--lime);opacity:0;
  text-shadow:0 0 26px rgba(182,255,59,.95),0 0 60px rgba(182,255,59,.5),0 3px 10px rgba(0,0,0,.75);
  white-space:nowrap;
  transition:transform .26s cubic-bezier(.2,1.5,.4,1),opacity .18s ease}
.fly-score.pop{opacity:1;transform:translate(-50%,-50%) scale(1)}          /* 先彈出站住 */
.fly-score.go{transition:transform 1.15s cubic-bezier(.45,.02,.3,1),opacity 1.15s ease}
.fly-score.big{font-size:88px}          /* 連擊高時字更大 */
.fly-score .mx{font-size:.45em;color:var(--amber);margin-left:8px;vertical-align:super;
  text-shadow:0 0 20px rgba(255,210,63,.9)}
@media(max-width:480px){.fly-score{font-size:52px}.fly-score.big{font-size:66px}}
/* 答錯：原地往下掉 */
.fly-miss{position:fixed;z-index:130;pointer-events:none;transform:translate(-50%,-50%);
  font-family:var(--f-pix);font-size:34px;color:var(--red);
  text-shadow:0 0 24px rgba(255,77,109,.95),0 3px 10px rgba(0,0,0,.75);
  white-space:nowrap;animation:missDrop 1.7s ease forwards}
@keyframes missDrop{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}
  12%{opacity:1;transform:translate(-50%,-64%) scale(1.12)}
  55%{opacity:1;transform:translate(-50%,-64%) scale(1)}
  100%{opacity:0;transform:translate(-50%,20%) scale(.9)}}
@media(max-width:480px){.fly-miss{font-size:24px}}
/* 分數入帳時跳動 */
@keyframes scoreBump{0%{transform:scale(1)}35%{transform:scale(1.42);filter:brightness(1.7)}100%{transform:scale(1)}}
